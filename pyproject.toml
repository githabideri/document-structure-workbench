[project]
name = "document-structure-workbench"
version = "0.1.0"
description = "Web application for reviewing and comparing document structure extraction results"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11,<3.13"
authors = [
    {name = "Document Structure Workbench contributors"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "Django>=5.2,<5.3",
    "Pillow>=10.0",
    "gunicorn>=23.0",
    "bleach>=6.2",
    "markdown>=3.5",
    "requests>=2.31",
    "whitenoise>=6.7",
]

[project.optional-dependencies]
postgres = [
    "psycopg2-binary>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-django>=4.5",
    "pytest-cov>=4.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["app"]
testpaths = ["app/workbench/tests"]
python_files = ["test_*.py", "*_test.py"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
